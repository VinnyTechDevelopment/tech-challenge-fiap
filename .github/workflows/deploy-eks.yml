name: Deploy infra (EKS)

# Deploy automático por branch (Fase 3): "main" -> produção, "homologacao" ->
# homologação. As duas usam o MESMO cluster EKS e o MESMO RDS (decisão
# tomada para não estourar o crédito do AWS Academy) — o isolamento entre
# ambientes vem do namespace do Kubernetes e da state key do Terraform, que
# mudam conforme a branch (ver step "Resolve ambiente" abaixo).
#
# O trigger é "workflow_run" da pipeline de build (não "push" direto): assim
# só disparamos o apply depois que a imagem já foi publicada no GHCR com a
# tag "sha-<7 chars>" que usamos aqui.

on:
  pull_request:
    branches: [main]
    paths: ["infra/**"]
  workflow_run:
    workflows: ["Build and Publish Docker image (GHCR)"]
    types: [completed]
    branches: [main, homologacao]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem a implantar"
        required: true
        default: "latest"
      environment:
        description: "Ambiente de destino"
        type: choice
        options:
          - production
          - homolog
        default: production

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_app_key: ${{ secrets.APP_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_customer_jwt_secret: ${{ secrets.CUSTOMER_JWT_SECRET }}
      TF_VAR_mail_username: ${{ secrets.MAIL_USERNAME }}
      TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
      TF_VAR_newrelic_license_key: ${{ secrets.NEWRELIC_LICENSE_KEY }}
      TF_VAR_ghcr_username: ${{ secrets.GHCR_USERNAME }}
      TF_VAR_ghcr_token: ${{ secrets.GHCR_TOKEN }}
      # O provider newrelic (infra/newrelic.tf) exige api_key/account_id no
      # schema dele — sem essas env vars presentes E não-vazias, o Terraform
      # fica preso pedindo input interativo pra elas, e como o runner não tem
      # TTY, trava pra sempre em vez de falhar rápido (mesmo problema que já
      # vimos com var.lab_role_arn no infra-kubernetes-fiap; confirmado com um
      # teste isolado — string vazia NÃO evita o prompt, precisa de um valor
      # de verdade, mesmo que fictício). Usa o secret real quando existir,
      # senão cai num valor fictício — newrelic_enabled continua false por
      # padrão, então esse valor nunca é usado pra chamar a API de verdade.
      NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY || 'NRAK-PLACEHOLDER-ATE-TER-CONTA' }}
      NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID || '0000000' }}
      # API Key + Account ID já nos secrets acima — dashboards como código
      # ligados de verdade.
      TF_VAR_newrelic_enabled: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve ambiente (branch -> namespace/state/tag)
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            branch="${{ github.event.workflow_run.head_branch }}"
            short_sha="$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)"
            image_tag="sha-${short_sha}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.environment }}" = "homolog" ]; then
              branch="homologacao"
            else
              branch="main"
            fi
            short_sha="$(echo "${{ github.sha }}" | cut -c1-7)"
            image_tag="${{ github.event.inputs.image_tag }}"
          else
            branch="main"
            short_sha="$(echo "${{ github.sha }}" | cut -c1-7)"
            image_tag="latest"
          fi
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          if [ "$branch" = "homologacao" ]; then
            echo "environment=homolog" >> "$GITHUB_OUTPUT"
            echo "namespace=postech-homolog" >> "$GITHUB_OUTPUT"
            echo "state_key=app/homolog/terraform.tfstate" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "namespace=postech" >> "$GITHUB_OUTPUT"
            echo "state_key=app/production/terraform.tfstate" >> "$GITHUB_OUTPUT"
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

          # GHCR exige path em minúsculas; github.repository preserva o case
          # do owner (ex.: "VinnyTechDevelopment/tech-challenge-fiap"), então
          # não dá pra usar direto — mesmo transform que build-ghcr.yml faz.
          image_repository="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=${{ steps.env.outputs.state_key }}"
          -backend-config="region=us-east-1"
          -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          TF_VAR_namespace: ${{ steps.env.outputs.namespace }}
          TF_VAR_environment: ${{ steps.env.outputs.environment }}
          TF_VAR_image_tag: ${{ steps.env.outputs.image_tag }}
          TF_VAR_image_repository: ${{ steps.env.outputs.image_repository }}
          # Curto de propósito: o nome do Job de migration concatena
          # "app-migrate-" + image_tag + rollout_id, e o Kubernetes injeta
          # esse nome como label "job-name" nos pods (limite de 63 bytes por
          # valor de label). O SHA completo (40 chars) estourava esse limite
          # por 1 caractere — confirmado em produção.
          TF_VAR_rollout_id: ${{ steps.env.outputs.short_sha }}
        run: terraform apply -auto-approve
