# Manifestos Kubernetes do os-service (Fase 4).
# Em EKS o deploy é feito pelo Terraform em infra/ (mesmos recursos, com
# valores reais de banco/fila/secret); estes YAMLs documentam a topologia e
# são validados no CI (kubeconform). Para aplicar manualmente:
#   kubectl apply -f k8s/
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postech-config
  namespace: postech
data:
  APP_NAME: "os-service"
  APP_ENV: "production"
  DB_CONNECTION: "mysql"
  DB_HOST: "<rds-os-endpoint>"
  DB_DATABASE: "techchallenge"
  DB_USERNAME: "techchallenge"
  MESSAGING_DRIVER: "sqs"
  MESSAGING_QUEUE_PREFIX: "production"
  AWS_DEFAULT_REGION: "us-east-1"
  EXECUTION_SERVICE_URL: "http://execution-app.execution.svc.cluster.local:8080"
  NEWRELIC_APPNAME: "os-service"
  LOG_CHANNEL: "stack"
  LOG_STACK: "stderr"
