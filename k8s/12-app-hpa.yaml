# Manifestos Kubernetes do os-service (Fase 4).
# Em EKS o deploy é feito pelo Terraform em infra/ (mesmos recursos, com
# valores reais de banco/fila/secret); estes YAMLs documentam a topologia e
# são validados no CI (kubeconform). Para aplicar manualmente:
#   kubectl apply -f k8s/
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: postech-app-hpa
  namespace: postech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postech-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
