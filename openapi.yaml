          type: string
          format: date-time
          example: '2026-04-08T14:30:00.000000Z'
        sent_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-04-08T14:31:00.000000Z'
    Saga:
      type: object
      properties:
