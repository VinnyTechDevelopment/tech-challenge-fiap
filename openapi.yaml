        email:
          type: string
          format: email
          example: joao@example.com
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos)
          example: '49150206818'
        password:
          type: string
          format: password
          minLength: 8
          example: senha12345
        password_confirmation:
          type: string
          format: password
          example: senha12345
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          format: password
          example: senha12345
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
