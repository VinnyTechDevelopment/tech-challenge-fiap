          nullable: true
        payment_id:
          type: string
          nullable: true
        approval_url:
          type: string
          nullable: true
        reject_url:
          type: string
          nullable: true
        payment_url:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        pending_compensations:
          type: array
          items:
            type: string
        deadline_at:
          type: string
          nullable: true
  responses:
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroAutenticacao'
          example:
            message: Token inválido ou expirado
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          example:
            message: Resource not found.
    ErroNegocio:
      description: Regra de negócio violada ou recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroNegocio'
          example:
            message: Servico '00000000-0000-0000-0000-000000000000' nao encontrado.
    ErroValidacaoLaravel:
      description: Erro de validação da requisição
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The given data was invalid.
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            message: The given data was invalid.
            errors:
              name:
              - O campo name é obrigatório.
              price:
              - O campo price deve ser numérico.
