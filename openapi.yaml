          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          description: Nome do item (snapshot)
          example: Filtro de óleo
        quantity:
          type: number
          format: float
          minimum: 0.01
          example: 2
        unit_price:
          type: number
          format: float
          description: Preço unitário no momento da criação da OS (snapshot)
          example: 35.0
    CreateServiceOrderRequest:
      type: object
