        year:
          type: integer
          minimum: 1900
          example: 2024
        plate:
          type: string
          pattern: ^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$
          example: ABC1D23
    ErroNegocio:
      type: object
      properties:
        message:
          type: string
          description: Mensagem de erro de regra de negócio
          example: Servico '00000000-0000-0000-0000-000000000000' nao encontrado.
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c1d2e3f4-a5b6-7890-cdef-012345678901
        name:
          type: string
          example: João Silva
        email:
          type: string
          format: email
          nullable: true
          example: joao@example.com
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos)
          example: '52998224725'
        phone:
          type: string
          nullable: true
          example: '11999999999'
    CreateCustomerRequest:
      type: object
      required:
      - name
      - document
      properties:
        name:
          type: string
          maxLength: 255
          example: João Silva
        email:
          type: string
          format: email
          nullable: true
          example: joao@example.com
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos)
          example: '52998224725'
        phone:
          type: string
          nullable: true
          example: '11999999999'
    UpdateCustomerRequest:
      type: object
      description: Todos os campos são opcionais
      properties:
        name:
          type: string
          maxLength: 255
          example: João Silva Atualizado
        email:
          type: string
          format: email
          nullable: true
          example: joao.novo@example.com
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos)
          example: '52998224725'
        phone:
          type: string
          nullable: true
          example: '11988888888'
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: n1o2t3i4-f5i6-7890-cati-on1234567890
        recipient_id:
          type: string
          format: uuid
          description: ID do destinatário (Customer)
          example: c1d2e3f4-a5b6-7890-cdef-012345678901
        type:
          type: string
          description: Canal de envio da notificação
          enum:
          - email
          - sms
          - push
          example: email
