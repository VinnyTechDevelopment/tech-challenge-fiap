          - QUOTE_REQUESTED
          - AWAITING_APPROVAL
          - AWAITING_PAYMENT
          - EXECUTION_REQUESTED
          - IN_EXECUTION
          - COMPLETED
          - COMPENSATING
          - CANCELLED
          - FAILED
        quote_id:
